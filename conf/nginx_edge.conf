# PatchShield Enterprise Edge Reverse Proxy Configuration (Nginx / OpenResty)
# Solves Single Point of Failure (SPOF) & High-Throughput Concurrency (>100,000 RPS)

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Low Latency I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;

    # Buffer Limits (Mitigates Slowloris & Buffer Overflow)
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Upstream Horizontal PatchShield Gateway Cluster
    upstream patchshield_cluster {
        least_conn; # Load balance based on fewest active connections
        server gateway-1:8000 max_fails=3 fail_timeout=10s;
        server gateway-2:8000 max_fails=3 fail_timeout=10s;
        server gateway-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 1024; # Persistent connection pool to gateway workers
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Real IP extraction behind Cloudflare / AWS ALB
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            proxy_pass http://patchshield_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Enable HTTP keepalive pooling
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High-throughput timeouts
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering off; # Direct streaming for low latency
        }

        # Health probe endpoint bypass
        location /healthz {
            access_log off;
            return 200 "OK\n";
        }
    }
}
